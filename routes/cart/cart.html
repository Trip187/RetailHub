<h1>Your Cart</h1>
<div>
  <form action="/cart/checkout" method="post">
    <input type="hidden" id="ProductId" name="ProductId" />
    <label for ="image" class="form-control" id="floatingInputDisabled">Product Image</label>
    <div class="image-preview" id="imagePreview">
      <img id="previewImg" alt="Image preview" style="display: block" />
      <label for="name" class="form-control" id="floatingInputDisabled">Product Name:</label>
      <input type="text" class="form-control" id="floatingInputDisabled" name="name" value="Sample Product" readonly />
      <br />
      <label for="price" class="form-control" id="floatingInputDisabled">Price:</label>
      <input type="number" id="price" name="price" value="19.99" step="0.01" readonly />
      <br />
      <label for="quantity" class="form-control" id="floatingInputDisabled">Quantity:</label>
      <input type="number" id="quantity" name="quantity" value="1" min="1" required />
    </div>
      <button type="submit">Checkout</button>
    
</div>
<script>
  var quantityInput = document.getElementById("quantity");
  var unitPriceInput = document.getElementById("unitPrice");
  var totalPriceInput = document.getElementById("totalPrice");

  quantityInput.addEventListener("input", function () {
    var quantity = parseFloat(quantityInput.value) || 1;
    var unitPrice = parseFloat(unitPriceInput.value) || 0;
    totalPriceInput.value = (quantity * unitPrice).toFixed(2);
  });
</script>
