<div class="container py-5">
  <div class="row justify-content-center g-4">
    <!-- Add Product Card -->
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card border-0 rounded-4 shadow h-100">
        <div
          class="card-header py-4 text-center rounded-top-4"
          style="background: linear-gradient(135deg, #4f46e5, #7c3aed)"
        >
          <h3 class="text-white fw-bold mb-0">Add New Product</h3>
          <p class="text-white-50 mb-0 mt-1" style="font-size: 0.9rem">
            Fill in the details to list a new product
          </p>
        </div>

        <div class="card-body p-4">
          <form action="/prodAdd" method="POST" enctype="multipart/form-data">
            <!-- Image -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                Product Image
                <span class="text-muted fw-normal">(optional)</span>
              </label>
              <div
                id="imagePreview"
                onclick="document.getElementById('image').click()"
                style="
                  width: 100%;
                  height: 220px;
                  border: 2px dashed #c4b5fd;
                  border-radius: 12px;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  background: #f5f3ff;
                  cursor: pointer;
                  overflow: hidden;
                  transition:
                    border-color 0.2s,
                    background 0.2s;
                "
                onmouseover="
                  this.style.borderColor = '#7c3aed';
                  this.style.background = '#ede9fe';
                "
                onmouseout="
                  this.style.borderColor = '#c4b5fd';
                  this.style.background = '#f5f3ff';
                "
              >
                <div id="placeholderContent" class="text-center">
                  <div style="font-size: 2.5rem; color: #a78bfa">📷</div>
                  <p class="mb-0 mt-2 text-muted" style="font-size: 0.85rem">
                    Click to upload image
                  </p>
                </div>
                <img
                  id="previewImg"
                  alt="Preview"
                  style="
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: none;
                    border-radius: 10px;
                  "
                />
              </div>
              <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
                class="d-none"
                onchange="previewImage(event)"
              />
            </div>

            <!-- Product Name -->
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold"
                >Product Name</label
              >
              <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="e.g. Wireless Headphones"
                required
              />
            </div>

            <!-- Price -->
            <div class="mb-4">
              <label for="price" class="form-label fw-semibold"
                >Price (KES)</label
              >
              <div class="input-group">
                <span
                  class="input-group-text"
                  style="
                    background: #ede9fe;
                    border-color: #c4b5fd;
                    color: #6d28d9;
                    font-weight: 600;
                  "
                >
                  KES
                </span>
                <input
                  type="number"
                  id="price"
                  name="price"
                  class="form-control"
                  placeholder="0.00"
                  step="0.01"
                  min="0"
                  required
                />
              </div>
            </div>

            <!-- Submit -->
            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-lg text-white fw-semibold"
                style="
                  background: linear-gradient(135deg, #4f46e5, #7c3aed);
                  border: none;
                  border-radius: 8px;
                "
              >
                Create Product
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Product List Card -->
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card border-0 rounded-4 shadow h-100">
        <div
          class="card-header py-4 text-center rounded-top-4"
          style="background: linear-gradient(135deg, #4f46e5, #7c3aed)"
        >
          <h3 class="text-white fw-bold mb-0">Manage Products</h3>
          <p class="text-white-50 mb-0 mt-1" style="font-size: 0.9rem">
            Delete existing products
          </p>
        </div>

        <div class="card-body p-4">
          <div id="product-list">
            <!--PRODUCTS-->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function previewImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = document.getElementById("previewImg");
      var placeholder = document.getElementById("placeholderContent");
      img.src = e.target.result;
      img.style.display = "block";
      placeholder.style.display = "none";
    };
    reader.readAsDataURL(file);
  }
</script>
